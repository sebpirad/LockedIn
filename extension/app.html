<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LockedIn</title>
<link rel="icon" href="icons/icon32.png">
<link rel="stylesheet" href="ui/app.css">
<link rel="stylesheet" href="ui/plan.css">
<script type="module" src="ui/app.js"></script>
</head>
<body>
<header class="apphead">
  <div class="tabs" role="tablist" aria-label="Side">
    <button id="tabFokus" class="tab" role="tab" type="button" aria-controls="fokusPage" aria-selected="true">Fokus</button>
    <button id="tabPlan" class="tab" role="tab" type="button" aria-controls="planPage" aria-selected="false" tabindex="-1">Plan</button>
  </div>
  <div id="planTools" class="plan-tools" hidden>
    <button id="planToday" class="ghost small" type="button">I dag</button>
    <button id="planPrev" class="navbtn" type="button" aria-label="Forrige uge"><svg viewBox="0 0 8 12" aria-hidden="true"><path d="M6 1L1 6l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="planNext" class="navbtn" type="button" aria-label="Næste uge"><svg viewBox="0 0 8 12" aria-hidden="true"><path d="M2 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <h1 id="planTitle" class="plan-title" aria-live="polite"></h1>
  </div>
  <span class="grow"></span>
  <button id="gear" class="gear" type="button" aria-label="Indstillinger" title="Indstillinger">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.6 7.6 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
  </button>
</header>

<div id="fokusPage" class="wrap" role="tabpanel" aria-labelledby="tabFokus">
  <main class="hero">
    <div id="modeSwitch" class="seg" role="group" aria-label="Starttype">
      <button type="button" data-mode="dur">Varighed</button>
      <button type="button" data-mode="until">Indtil</button>
    </div>

    <div id="big" class="big" aria-live="off">01:00:00</div>
    <p id="sub" class="sub" hidden></p>

    <div id="durInput" class="inputs">
      <div id="presets" class="chips" role="group" aria-label="Varighed"></div>
      <div id="customRow" class="clock-row" hidden>
        <div id="durH" class="dd clock"><button id="durHBtn" class="select-btn compact" type="button"><span id="durHVal"></span><span class="unit">t</span><svg class="caret" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="durHMenu" class="menu combo-menu" hidden></div></div>
        <div id="durM" class="dd clock"><button id="durMBtn" class="select-btn compact" type="button"><span id="durMVal"></span><span class="unit">min</span><svg class="caret" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="durMMenu" class="menu combo-menu" hidden></div></div>
      </div>
    </div>
    <div id="untilInput" class="inputs" hidden>
      <div class="clock-row">
        <div id="untH" class="dd clock"><button id="untHBtn" class="select-btn compact" type="button"><span id="untHVal"></span><svg class="caret" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="untHMenu" class="menu combo-menu" hidden></div></div>
        <span class="sep">:</span>
        <div id="untM" class="dd clock"><button id="untMBtn" class="select-btn compact" type="button"><span id="untMVal"></span><svg class="caret" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><div id="untMMenu" class="menu combo-menu" hidden></div></div>
      </div>
    </div>

    <div id="listLine" class="list-line">
      <button id="listBtn" class="select-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Liste">
        <span id="listName"></span><svg class="caret" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span id="listEmpty" class="list-empty" hidden>Tom liste</span>
      <span id="listStatic" class="list-static" hidden></span>
      <form id="nameForm" class="name-form" hidden>
        <input id="nameInput" maxlength="40" autocomplete="off" aria-label="Navn på listen">
      </form>
      <div id="listMenu" class="menu" role="menu" hidden></div>
    </div>

    <div id="tiles" class="tiles"></div>

    <p id="alert" class="alert" role="status" hidden></p>
    <div class="actions">
      <button id="start" class="primary" type="button">Start Locked in</button>
      <button id="lockNow" class="primary" type="button" hidden>Lås nu</button>
      <button id="back" class="ghost" type="button" hidden>Tilbage</button>
    </div>
  </main>

  <div id="tapConfirm" class="confirm-bar" role="alertdialog" hidden>
    <span id="tapText"></span>
    <span class="actions">
      <button id="tapYes" class="primary small" type="button">Bloker</button>
      <button id="tapNo" class="ghost small" type="button">Annullér</button>
    </span>
  </div>

  <div class="after">
    <button id="extend" class="quiet" type="button" hidden>Forlæng</button>
    <div id="extendPanel" class="extend" hidden>
      <div id="extendChips" class="chips" role="group" aria-label="Forlæng med"></div>
      <div class="actions">
        <button id="extendNow" class="primary small" type="button">Forlæng</button>
        <button id="extendBack" class="ghost small" type="button">Tilbage</button>
      </div>
    </div>
    <button id="nextBtn" class="next-btn" type="button" hidden>
      <span id="nextText"></span><svg viewBox="0 0 8 12" aria-hidden="true"><path d="M2 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<dialog id="addDlg" class="sheet" aria-label="Tilføj">
  <div class="sheet-head">
    <div id="addKind" class="seg" role="group">
      <button type="button" data-kind="site">Hjemmeside</button>
      <button type="button" data-kind="app">App</button>
    </div>
    <button id="addClose" class="icon-btn" type="button" aria-label="Luk">×</button>
  </div>
  <form id="addSite" class="inline-form">
    <input id="siteDomain" maxlength="253" placeholder="domæne.dk" autocomplete="off" spellcheck="false" aria-label="Domæne">
    <input id="siteLabel" maxlength="40" placeholder="Navn (valgfrit)" autocomplete="off" aria-label="Navn">
    <div class="actions left"><button id="siteSubmit" class="primary small" type="submit">Tilføj</button></div>
    <p class="field-err" id="siteErr" hidden></p>
  </form>
  <div id="addApp" class="picker" hidden>
    <input id="pickerSearch" type="search" placeholder="Søg" autocomplete="off" aria-label="Søg efter app">
    <ul id="pickerList" class="list picker-list"></ul>
  </div>
</dialog>

<dialog id="settings" class="drawer" aria-label="Indstillinger">
  <div class="drawer-head">
    <h2>Indstillinger</h2>
    <button id="settingsClose" class="icon-btn" type="button" aria-label="Luk">×</button>
  </div>

  <section id="appsSection">
    <h3 id="neverTitle">Lukkes aldrig</h3>
    <ul id="appList" class="list" aria-labelledby="neverTitle"></ul>
    <button id="neverAdd" class="add" type="button">+ App</button>
  </section>
</dialog>

<section id="planPage" class="planpage" role="tabpanel" aria-labelledby="tabPlan" hidden>
  <div class="cal">
    <div id="dayStrip" class="daystrip" role="group" aria-label="Dag"></div>
    <div id="planScroll" class="gridwrap">
      <div id="planHead" class="ghead" aria-hidden="true"></div>
      <div id="planGrid" class="gbody" tabindex="0" role="group" aria-label="Kalender. Piletasterne flytter tiden, Skift og pil ændrer længden, Enter opretter en periode." aria-describedby="planLive"></div>
    </div>
    <p id="planLive" class="sr-only" aria-live="polite"></p>
  </div>
  <aside id="planPanel" class="panel" aria-label="Periode"></aside>
</section>

<div id="undo" class="toast undo" role="status" hidden><span id="undoText"></span><button id="undoBtn" class="ghost small" type="button">Fortryd</button></div>

<div id="toast" class="toast" role="alert" hidden></div>
</body>
</html>
