<!doctype html>
<!-- DEV ONLY. Design direction 2, variant A "Mørkekammer": the portrait bleeds off the right edge and dissolves into
     black; the quote stands in the dark beside it. Engine: d2-stage.js. Fonts: macOS system fonts only (Hoefler Text,
     SF Pro via system-ui) — nothing bundled, nothing remote. -->
<html lang="da" data-variant="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>LockedIn</title>
<link rel="icon" href="../../icons/icon32.png">
<style>
:root {
  color-scheme: dark;
  --black: #050505;
  --ink: #f5f0e7;      /* quote                           */
  --ink-2: #e6dfd2;    /* name, countdown                 */
  --mute: #aaa397;     /* dates                           */
  --quiet: #969086;    /* host, credits — 12 px, see audit */
  --accent: #f2c14e;   /* LockedIn yellow, used twice      */
  --serif: 'Hoefler Text', 'Iowan Old Style', 'Palatino', Georgia, serif;
  --sans: system-ui, -apple-system, 'Helvetica Neue', sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --fx: 70vw; --fy: 36vh; --fh: 30vh; --card-top: 60vh; --qpx: 48px; --grain: .36;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--black); color: var(--ink);
  font: 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
[hidden] { display: none !important; }
a { color: inherit; text-decoration-color: rgba(255, 255, 255, .28); text-underline-offset: 2px; }
a:hover { text-decoration-color: currentColor; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

/* ---------- scene: haze · plate · light · grain ---------- */
.scene { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; background: var(--black); }
#haze {
  position: absolute; inset: -12%; width: 124%; height: 124%; object-fit: cover;
  filter: blur(64px); opacity: 0; transition: opacity 600ms ease;
}
#haze:has(~ #plate.is-lit) { opacity: var(--haze, .1); }
#plate {
  position: absolute; opacity: 0;
  transition: opacity 600ms cubic-bezier(.4, 0, .2, 1);
  --ml: 0px; --mr: 0px; --mt0: 0px; --mt: 0px; --mb: 0px; --fb0: 100%; --fb1: 100%;
  mask-image:
    linear-gradient(to right, transparent 0, rgba(0,0,0,.1) calc(var(--ml) * .3), rgba(0,0,0,.45) calc(var(--ml) * .62), #000 var(--ml)),
    linear-gradient(to left, transparent 0, rgba(0,0,0,.45) calc(var(--mr) * .5), #000 var(--mr)),
    linear-gradient(to bottom, transparent var(--mt0), #000 var(--mt)),
    linear-gradient(to top, transparent 0, #000 var(--mb));
  mask-composite: intersect;
  will-change: transform;
}
#plate.fade-bottom {
  mask-image:
    linear-gradient(to right, transparent 0, #000 var(--ml)),
    linear-gradient(to left, transparent 0, #000 var(--mr)),
    linear-gradient(to bottom, transparent var(--mt0), #000 var(--mt)),
    linear-gradient(to bottom, #000 var(--fb0), rgba(0,0,0,.55) calc(var(--fb0) + (var(--fb1) - var(--fb0)) * .35), rgba(0,0,0,.15) calc(var(--fb0) + (var(--fb1) - var(--fb0)) * .7), transparent var(--fb1));
}
#plate.is-lit { opacity: 1; animation: drift 60s cubic-bezier(.3, .1, .3, 1) 100ms both; }
@keyframes drift { from { transform: scale(1); } to { transform: scale(1.055); } }
#print { display: block; width: 100%; height: 100%; }

.light {
  position: absolute; inset: 0;
  background:
    radial-gradient(circle at var(--fx) var(--fy), transparent 0, transparent calc(var(--fh) * 1.05), rgba(0,0,0,.28) calc(var(--fh) * 2), rgba(0,0,0,.6) calc(var(--fh) * 3.4)),
    linear-gradient(90deg, rgba(0,0,0,.9) 0, rgba(0,0,0,.78) 30%, rgba(0,0,0,.42) 47%, rgba(0,0,0,0) 62%),
    linear-gradient(0deg, rgba(0,0,0,.95) 0, rgba(0,0,0,.91) 10%, rgba(0,0,0,.55) 18%, rgba(0,0,0,0) 33%),
    linear-gradient(180deg, rgba(0,0,0,.74) 0, rgba(0,0,0,.42) 7%, rgba(0,0,0,0) 16%);
}
.grain {
  position: absolute; inset: 0; background-image: var(--grain-img); background-size: 192px 192px;
  mix-blend-mode: overlay; opacity: var(--grain);
}
.is-ended #plate.is-lit { filter: brightness(1.12); transition: opacity 600ms, filter 600ms ease; }

/* ---------- stage ---------- */
.stage {
  position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto;
  padding: clamp(24px, 4.4vh, 44px) clamp(28px, 6.2vw, 104px) clamp(22px, 4vh, 40px);
}
.host { margin: 0; font: 400 12px/1.4 var(--sans); letter-spacing: .02em; color: var(--quiet); min-height: 1.4em; }
#middle { display: flex; align-items: center; min-height: 0; padding: clamp(16px, 3vh, 32px) 0; }
.card { margin: 0; width: min(47vw, 780px); }
#text {
  margin: 0; font-family: var(--serif); font-weight: 400; color: var(--ink);
  font-kerning: normal; font-variant-ligatures: common-ligatures;
  text-wrap: balance; text-shadow: 0 0 32px rgba(0, 0, 0, .55);
}
#text.many { text-wrap: pretty;
}
.who { margin: calc(var(--qpx) * .42 + 12px) 0 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.who::before { content: ""; width: 28px; height: 1px; background: var(--accent); flex: none; }
#name {
  font: 600 clamp(14px, calc(var(--qpx) * .24), 19px)/1.2 var(--sans); letter-spacing: .24em; text-transform: uppercase;
  color: var(--ink-2);
}
#dates { font: 400 13px/1.2 var(--sans); letter-spacing: .04em; color: var(--mute); font-variant-numeric: tabular-nums; }

.foot { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: end; gap: 12px 48px; }
#remain {
  font: 200 clamp(34px, 4.8vh, 46px)/1 var(--sans); letter-spacing: -.01em; font-variant-numeric: tabular-nums;
  color: var(--ink-2);
}
#ended { margin: 0; font: 400 clamp(20px, 2.7vh, 26px)/1.3 var(--serif); color: var(--ink); }
#ended a { display: block; margin-top: 4px; font: 500 15px/1.4 var(--sans); color: var(--accent); text-decoration: none; }
#ended a::after { content: " →"; }
#ended a:hover { text-decoration: underline; }
#credits {
  margin: 0; justify-self: end; max-width: min(44vw, 560px); text-align: right;
  font: 400 12px/1.5 var(--sans); color: var(--quiet); text-wrap: pretty;
}

/* look room: the sitter turns right → portrait on the left, quote on the right (set by d2-stage.js from yaw) */
.flip .light {
  background:
    radial-gradient(circle at var(--fx) var(--fy), transparent 0, transparent calc(var(--fh) * 1.05), rgba(0,0,0,.28) calc(var(--fh) * 2), rgba(0,0,0,.6) calc(var(--fh) * 3.4)),
    linear-gradient(270deg, rgba(0,0,0,.9) 0, rgba(0,0,0,.78) 30%, rgba(0,0,0,.42) 47%, rgba(0,0,0,0) 62%),
    linear-gradient(0deg, rgba(0,0,0,.95) 0, rgba(0,0,0,.91) 10%, rgba(0,0,0,.55) 18%, rgba(0,0,0,0) 33%),
    linear-gradient(180deg, rgba(0,0,0,.74) 0, rgba(0,0,0,.42) 7%, rgba(0,0,0,0) 16%);
}
.flip .card, .flip .host { margin-left: auto; width: min(47vw, 780px); }
.flip .foot { grid-template-columns: minmax(0, 1fr) min(47vw, 780px); }
.flip .time { grid-column: 2; grid-row: 1; }
.flip #credits { grid-column: 1; grid-row: 1; justify-self: start; text-align: left; }

/* entrance ≤ 600 ms */
#text, .who, .foot, .host { opacity: 0; }
.is-in #text { animation: rise 520ms var(--ease) 40ms both; }
.is-in .who { animation: rise 460ms var(--ease) 130ms both; }
.is-in .foot, .is-in .host { animation: fade 400ms ease 200ms both; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

.no-portrait .card { width: min(62vw, 900px); }

/* ---------- tall: phone, narrow or portrait windows ---------- */
@media (max-width: 759px), (max-aspect-ratio: 19/20) {
  .stage { padding: max(14px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  #middle { align-items: flex-end; padding: 0 0 22px; }
  .card { width: 100%; max-width: 560px; }
  .who { gap: 12px; }
  .who::before { width: 20px; }
  .foot { grid-template-columns: 1fr; gap: 12px; }
  #remain { font-size: 34px; }
  #credits { justify-self: start; text-align: left; max-width: none; font-size: 11.5px; }
  .light {
    background:
      radial-gradient(circle at var(--fx) var(--fy), transparent 0, transparent calc(var(--fh) * 1.2), rgba(0,0,0,.22) calc(var(--fh) * 2.4), rgba(0,0,0,.45) calc(var(--fh) * 3.6)),
      linear-gradient(180deg, rgba(0,0,0,.9) 0, rgba(0,0,0,.66) 46px, rgba(0,0,0,0) 132px),
      linear-gradient(180deg, rgba(0,0,0,0) calc(var(--card-top) - 18vh), rgba(0,0,0,.6) calc(var(--card-top) - 2vh), rgba(0,0,0,.88) var(--card-top));
  }
}

/* ---------- reduced motion: no drift, no travel; a short fade only ---------- */
@media (prefers-reduced-motion: reduce) {
  #plate.is-lit { animation: none; }
  #plate { transition-duration: 200ms; }
  .is-in #text, .is-in .who, .is-in .foot, .is-in .host { animation: fade 200ms ease both; }
}
.still #plate.is-lit { animation: none; }
.still #plate, .still #haze { transition: none; }
/* small text over imagery gets a soft dark halo; invisible on black, not counted in the contrast audit */
.host, #credits, #remain, #ended { text-shadow: 0 0 14px rgba(0, 0, 0, .85); }
.notext .stage * { visibility: hidden !important; }
</style>
<script type="module" src="d2-stage.js"></script>
</head>
<body>
<div class="scene" aria-hidden="true">
  <canvas id="haze"></canvas>
  <div id="plate"><canvas id="print"></canvas></div>
  <div class="light"></div>
  <div class="grain"></div>
</div>
<main class="stage">
  <p class="host" id="host"></p>
  <div id="middle">
    <figure class="card" id="card">
      <blockquote id="text" lang="en"></blockquote>
      <figcaption class="who"><span id="name"></span><span id="dates"></span></figcaption>
    </figure>
  </div>
  <footer class="foot">
    <div class="time">
      <div id="remain" role="timer" aria-label="Tid tilbage" hidden>00:00:00</div>
      <p id="ended" hidden>Fokussessionen er slut <a id="backLink" href="#" hidden></a></p>
    </div>
    <p id="credits"></p>
  </footer>
</main>
</body>
</html>
